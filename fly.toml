# Hosted demo at https://mandate.fly.dev. One always-on machine runs the
# dashboard (8080, with /api proxied to the API), the API, the facilitator and
# the demo stores (public on :4021). Secrets are set with `fly secrets`.
app = "mandate"
primary_region = "yyz"

[env]
  NODE_ENV = "production"
  PAYMENTS_CHAIN_DB = "/data/agent-keys.sqlite"
  WEB_ORIGIN = "https://mandate.fly.dev"
  RECEIPTS_HOST = "127.0.0.1"
  RECEIPTS_PORT = "4022"
  PAYMENTS_API_URL = "http://127.0.0.1:4022"
  MERCHANT_HOST = "0.0.0.0"
  MERCHANT_PORT = "4021"
  STORES_URL = "https://mandate.fly.dev:4021"
  FACILITATOR_PORT = "4023"
  FACILITATOR_URL = "http://127.0.0.1:4023"

[mounts]
  source = "mandate_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

# Demo stores, reached by agents over x402.
[[services]]
  internal_port = 4021
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4021
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
